<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Due calici di spritz che brindano al bancone">
  <defs>
    <linearGradient id="ap-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a1119" />
      <stop offset="60%" stop-color="#3d0e17" />
      <stop offset="100%" stop-color="#26080e" />
    </linearGradient>
    <radialGradient id="ap-luce" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f6dfa8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d8b878" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ap-spritz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0a44a" />
      <stop offset="55%" stop-color="#e2762c" />
      <stop offset="100%" stop-color="#c8511f" />
    </linearGradient>
    <linearGradient id="ap-vetro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f7efe2" stop-opacity="0.34" />
      <stop offset="35%" stop-color="#f7efe2" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#f7efe2" stop-opacity="0.24" />
    </linearGradient>
    <linearGradient id="ap-legno" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7a4a2c" />
      <stop offset="100%" stop-color="#4a2a18" />
    </linearGradient>

    <g id="ap-calice">
      <!-- coppa a palloncino -->
      <path d="M-80-150C-92-58-58 60 0 60S92-58 80-150Z" fill="#f7efe2" fill-opacity="0.13" />
      <path d="M-80-150C-92-58-58 60 0 60S92-58 80-150Z" fill="url(#ap-vetro)" />
      <!-- bevanda -->
      <path d="M-74-55C-70 6-44 52 0 52S70 6 74-55Z" fill="url(#ap-spritz)" />
      <ellipse cx="0" cy="-55" rx="74" ry="13" fill="#f6c98a" opacity="0.75" />
      <!-- ghiaccio -->
      <rect x="-50" y="-38" width="40" height="40" rx="8" fill="#fffaf2" opacity="0.42" transform="rotate(-14 -30 -18)" />
      <rect x="6" y="-22" width="34" height="34" rx="7" fill="#fffaf2" opacity="0.32" transform="rotate(18 23 -5)" />
      <!-- fetta d'arancia -->
      <g transform="translate(20 -8)">
        <circle r="30" fill="#f4a63a" />
        <circle r="24" fill="#f8c46a" />
        <g stroke="#e07c22" stroke-width="2.5" opacity="0.85">
          <path d="M0-24V24M-24 0H24M-17-17 17 17M-17 17 17-17" />
        </g>
        <circle r="30" fill="none" stroke="#e07c22" stroke-width="3" />
      </g>
      <!-- bollicine -->
      <g fill="#fffaf2" opacity="0.5">
        <circle cx="-40" cy="12" r="4" /><circle cx="-28" cy="32" r="3" />
        <circle cx="-14" cy="6" r="3.5" /><circle cx="42" cy="26" r="3" />
        <circle cx="-48" cy="-4" r="2.5" /><circle cx="6" cy="36" r="2.5" />
      </g>
      <!-- riflesso sul vetro -->
      <path d="M-58-134C-66-58-46 22-16 44" fill="none" stroke="#fffaf2" stroke-opacity="0.4" stroke-width="7" stroke-linecap="round" />
      <!-- profilo, bocca, stelo e piede -->
      <path d="M-80-150C-92-58-58 60 0 60S92-58 80-150" fill="none" stroke="#f7efe2" stroke-opacity="0.6" stroke-width="4" />
      <ellipse cx="0" cy="-150" rx="80" ry="15" fill="#f7efe2" fill-opacity="0.1" stroke="#f7efe2" stroke-opacity="0.65" stroke-width="4" />
      <rect x="-5" y="60" width="10" height="86" fill="#f7efe2" fill-opacity="0.18" stroke="#f7efe2" stroke-opacity="0.4" stroke-width="2" />
      <ellipse cx="0" cy="148" rx="52" ry="11" fill="#f7efe2" fill-opacity="0.14" stroke="#f7efe2" stroke-opacity="0.45" stroke-width="3" />
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#ap-fondo)" />

  <!-- scaffali di bottiglie sfocati -->
  <g opacity="0.42">
    <g fill="none" stroke="#b8914f" stroke-opacity="0.5" stroke-width="4">
      <path d="M90 250h1420M90 470h1420" />
    </g>
    <g fill="#8a5a2f" opacity="0.75">
      <g><rect x="150" y="120" width="46" height="130" rx="14" /><rect x="230" y="140" width="46" height="110" rx="14" /><rect x="310" y="110" width="46" height="140" rx="14" /><rect x="390" y="145" width="46" height="105" rx="14" /><rect x="470" y="125" width="46" height="125" rx="14" /></g>
      <g opacity="0.8"><rect x="1090" y="130" width="46" height="120" rx="14" /><rect x="1170" y="112" width="46" height="138" rx="14" /><rect x="1250" y="142" width="46" height="108" rx="14" /><rect x="1330" y="122" width="46" height="128" rx="14" /></g>
      <g opacity="0.6"><rect x="180" y="350" width="44" height="120" rx="13" /><rect x="260" y="368" width="44" height="102" rx="13" /><rect x="1240" y="352" width="44" height="118" rx="13" /><rect x="1320" y="372" width="44" height="98" rx="13" /></g>
    </g>
  </g>

  <!-- luci calde -->
  <g>
    <circle cx="1418" cy="120" r="150" fill="url(#ap-luce)" />
    <circle cx="250" cy="330" r="110" fill="url(#ap-luce)" opacity="0.6" />
    <circle cx="800" cy="180" r="190" fill="url(#ap-luce)" opacity="0.45" />
  </g>

  <!-- bancone -->
  <rect x="0" y="800" width="1600" height="200" fill="url(#ap-legno)" />
  <g stroke="#2a1409" stroke-opacity="0.35" stroke-width="3">
    <path d="M0 848h1600M0 902h1600M0 956h1600" />
  </g>

  <!-- i due calici del brindisi -->
  <g transform="translate(690 640) rotate(-14)"><use href="#ap-calice" /></g>
  <g transform="translate(910 640) rotate(14)"><use href="#ap-calice" /></g>

  <!-- scintilla del brindisi -->
  <g transform="translate(800 472)" fill="#f6dfa8" opacity="0.9">
    <path d="M0-46 8-8 46 0 8 8 0 46-8 8-46 0-8-8Z" />
  </g>

  <!-- riflessi sul legno -->
  <g fill="#f0a44a" opacity="0.16">
    <ellipse cx="690" cy="800" rx="92" ry="16" />
    <ellipse cx="910" cy="800" rx="92" ry="16" />
  </g>
</svg>
