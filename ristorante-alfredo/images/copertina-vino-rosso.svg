<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Il vino rosso della casa in tavola">
  <defs>
    <radialGradient id="s-fondo" cx="22%" cy="14%" r="92%">
      <stop offset="0%" stop-color="#8a6a52" />
      <stop offset="42%" stop-color="#4e2f28" />
      <stop offset="100%" stop-color="#22110f" />
    </radialGradient>
    <radialGradient id="s-alone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdca4" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#ffdca4" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="s-vetro" x1="0.1" y1="0" x2="0.9" y2="0">
      <stop offset="0%" stop-color="#3a2119" />
      <stop offset="22%" stop-color="#6d3428" />
      <stop offset="48%" stop-color="#8e4432" />
      <stop offset="78%" stop-color="#5a2a20" />
      <stop offset="100%" stop-color="#2b140f" />
    </linearGradient>
    <linearGradient id="s-vino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a32a2a" />
      <stop offset="100%" stop-color="#6b1220" />
    </linearGradient>
    <linearGradient id="s-capsula" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6b1220" />
      <stop offset="45%" stop-color="#b23a3a" />
      <stop offset="100%" stop-color="#4a0d16" />
    </linearGradient>
    <linearGradient id="s-tavolo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4526" />
      <stop offset="100%" stop-color="#341f11" />
    </linearGradient>
    <linearGradient id="s-etichetta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2" />
      <stop offset="100%" stop-color="#e9dcc2" />
    </linearGradient>
    <filter id="s-sfocatura" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#s-fondo)" />

  <!-- sala sfocata alle spalle -->
  <g filter="url(#s-sfocatura)" opacity="0.8">
    <circle cx="300" cy="90" r="300" fill="url(#s-alone)" />
    <rect x="1180" y="120" width="330" height="470" rx="10" fill="#efe6d6" opacity="0.5" />
    <rect x="60" y="180" width="240" height="380" rx="16" fill="#e8dcc4" opacity="0.22" />
    <circle cx="1320" cy="200" r="120" fill="url(#s-alone)" opacity="0.5" />
  </g>

  <!-- tavolo con la tovaglia -->
  <rect x="0" y="640" width="1600" height="260" fill="url(#s-tavolo)" />
  <rect x="0" y="640" width="1600" height="10" fill="#a9784a" opacity="0.6" />
  <rect x="120" y="656" width="1360" height="150" fill="#efe6d6" opacity="0.5" />
  <rect x="120" y="656" width="1360" height="8" fill="#fffaf2" opacity="0.35" />

  <!-- calice pieno, a destra -->
  <g transform="translate(1430 620)">
    <path d="M-68-210C-68-104-40-26 0-26S68-104 68-210Z" fill="#f7efe2" fill-opacity="0.3" />
    <path d="M-56-104C-52-58-28-32 0-32S52-58 56-104Z" fill="url(#s-vino)" />
    <path d="M-68-210C-68-104-40-26 0-26S68-104 68-210" fill="none" stroke="#fffaf2" stroke-opacity="0.8" stroke-width="5" />
    <ellipse cx="0" cy="-210" rx="68" ry="14" fill="none" stroke="#fffaf2" stroke-opacity="0.8" stroke-width="5" />
    <rect x="-5" y="-26" width="10" height="92" fill="#fffaf2" fill-opacity="0.45" />
    <ellipse cx="0" cy="68" rx="48" ry="11" fill="#fffaf2" fill-opacity="0.4" stroke="#fffaf2" stroke-opacity="0.6" stroke-width="4" />
  </g>

  <!-- calice vuoto, a sinistra -->
  <g transform="translate(215 620)" opacity="0.7">
    <path d="M-60-186C-60-92-36-22 0-22S60-92 60-186Z" fill="#f7efe2" fill-opacity="0.18" />
    <path d="M-60-186C-60-92-36-22 0-22S60-92 60-186" fill="none" stroke="#fffaf2" stroke-opacity="0.6" stroke-width="4" />
    <ellipse cx="0" cy="-186" rx="60" ry="12" fill="none" stroke="#fffaf2" stroke-opacity="0.6" stroke-width="4" />
    <rect x="-4" y="-22" width="8" height="84" fill="#fffaf2" fill-opacity="0.35" />
    <ellipse cx="0" cy="62" rx="42" ry="10" fill="#fffaf2" fill-opacity="0.3" stroke="#fffaf2" stroke-opacity="0.5" stroke-width="3" />
  </g>

  <!-- la bottiglia -->
  <g transform="translate(1235 0)">
    <path d="M-44 96h88v186c0 30 18 48 40 70 24 26 36 56 36 98v240a26 26 0 0 1-26 26h-188a26 26 0 0 1-26-26V450c0-42 12-72 36-98 22-22 40-40 40-70Z" fill="url(#s-vetro)" />
    <rect x="-46" y="58" width="92" height="70" rx="9" fill="url(#s-capsula)" />
    <path d="M-18 150c-10 66-24 88-46 114-18 22-26 48-26 82v270" fill="none" stroke="#fffaf2" stroke-opacity="0.3" stroke-width="14" stroke-linecap="round" />

    <rect x="-116" y="440" width="232" height="268" rx="6" fill="url(#s-etichetta)" />
    <rect x="-116" y="440" width="232" height="92" fill="#b2502c" opacity="0.9" />
    <text x="0" y="476" text-anchor="middle" font-family="Georgia, serif" font-size="21" letter-spacing="4" fill="#fffaf2">RISTORANTE</text>
    <text x="0" y="518" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="38" fill="#fffaf2">Alfredo</text>
    <text x="0" y="590" text-anchor="middle" font-family="Georgia, serif" font-size="19" fill="#7a5a2a">Vino dei</text>
    <text x="0" y="626" text-anchor="middle" font-family="Georgia, serif" font-size="27" fill="#a32a2a">Castelli Romani</text>
    <text x="0" y="656" text-anchor="middle" font-family="Georgia, serif" font-size="15" letter-spacing="3" fill="#7a5a2a">D O C</text>
    <path d="M-78 674h156M-78 686h156" stroke="#c2a780" stroke-width="1.5" />
  </g>

  <!-- ciotola di olive -->
  <g transform="translate(380 700)">
    <path d="M-70 0c0 38 32 58 70 58s70-20 70-58Z" fill="#efe6d6" />
    <ellipse cx="0" cy="0" rx="70" ry="18" fill="#fffaf2" />
    <g fill="#7d8f3c">
      <circle cx="-34" cy="-3" r="15" /><circle cx="-4" cy="2" r="16" />
      <circle cx="26" cy="-3" r="14" /><circle cx="8" cy="-14" r="13" />
    </g>
  </g>

  <!-- velo caldo -->
  <rect width="1600" height="900" fill="#2a0a10" opacity="0.22" />
</svg>