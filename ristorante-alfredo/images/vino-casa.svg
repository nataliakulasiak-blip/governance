<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="La bottiglia del vino della casa">
  <defs>
    <linearGradient id="v-fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7efe2" />
      <stop offset="58%" stop-color="#e6d8bd" />
      <stop offset="100%" stop-color="#c2a780" />
    </linearGradient>
    <linearGradient id="v-vetro" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a8f53" />
      <stop offset="22%" stop-color="#cfd08a" />
      <stop offset="48%" stop-color="#e8e4a8" />
      <stop offset="78%" stop-color="#a9ab68" />
      <stop offset="100%" stop-color="#6f7440" />
    </linearGradient>
    <linearGradient id="v-vino" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6e9b4" />
      <stop offset="100%" stop-color="#e3cf82" />
    </linearGradient>
    <linearGradient id="v-etichetta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2" />
      <stop offset="100%" stop-color="#efe2c9" />
    </linearGradient>
    <linearGradient id="v-capsula" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6a34" />
      <stop offset="45%" stop-color="#d8b878" />
      <stop offset="100%" stop-color="#6f5228" />
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#v-fondo)" />

  <!-- tavolo -->
  <rect x="0" y="790" width="800" height="210" fill="#6b4526" />
  <rect x="0" y="790" width="800" height="12" fill="#9a6c40" />
  <rect x="60" y="806" width="680" height="120" fill="#e8dcc4" opacity="0.55" />

  <!-- calice -->
  <g transform="translate(610 560)">
    <path d="M-62-190C-62-96-36-24 0-24S62-96 62-190Z" fill="#f7efe2" fill-opacity="0.4" />
    <path d="M-52-96C-48-56-26-30 0-30S48-56 52-96Z" fill="url(#v-vino)" />
    <path d="M-62-190C-62-96-36-24 0-24S62-96 62-190" fill="none" stroke="#fffaf2" stroke-width="5" stroke-opacity="0.85" />
    <ellipse cx="0" cy="-190" rx="62" ry="13" fill="none" stroke="#fffaf2" stroke-width="5" stroke-opacity="0.85" />
    <rect x="-4" y="-24" width="8" height="86" fill="#fffaf2" fill-opacity="0.55" />
    <ellipse cx="0" cy="64" rx="44" ry="10" fill="#fffaf2" fill-opacity="0.5" stroke="#fffaf2" stroke-opacity="0.7" stroke-width="4" />
  </g>

  <!-- bottiglia -->
  <g transform="translate(360 0)">
    <path d="M-36 150h72v168c0 26 16 42 34 62 20 22 30 48 30 84v292a24 24 0 0 1-24 24h-152a24 24 0 0 1-24-24V464c0-36 10-62 30-84 18-20 34-36 34-62Z" fill="url(#v-vetro)" />
    <rect x="-38" y="118" width="76" height="62" rx="8" fill="url(#v-capsula)" />
    <path d="M-14 200c-8 60-20 80-40 104-16 20-24 44-24 74v276" fill="none" stroke="#fffaf2" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round" />

    <!-- etichetta -->
    <rect x="-102" y="500" width="204" height="250" rx="6" fill="url(#v-etichetta)" />
    <rect x="-102" y="500" width="204" height="86" fill="#d98a3c" opacity="0.85" />
    <text x="0" y="534" text-anchor="middle" font-family="Georgia, serif" font-size="19" letter-spacing="3" fill="#fffaf2">RISTORANTE</text>
    <text x="0" y="572" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#fffaf2">Alfredo</text>
    <text x="0" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#7a5a2a">Vino dei</text>
    <text x="0" y="672" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#a32a2a">Castelli Romani</text>
    <text x="0" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="14" letter-spacing="2" fill="#7a5a2a">D O C</text>
    <g stroke="#c2a780" stroke-width="1.5">
      <path d="M-70 714h140M-70 724h140" />
    </g>
    <text x="-88" y="742" font-family="Georgia, serif" font-size="12" fill="#8a6a34">750 ml</text>
    <text x="88" y="742" text-anchor="end" font-family="Georgia, serif" font-size="12" fill="#8a6a34">12,5% vol</text>
  </g>

  <!-- ciotola di olive -->
  <g transform="translate(150 800)">
    <path d="M-80 0c0 44 36 66 80 66s80-22 80-66Z" fill="#efe6d6" />
    <ellipse cx="0" cy="0" rx="80" ry="20" fill="#fffaf2" />
    <g fill="#7d8f3c">
      <circle cx="-40" cy="-4" r="17" /><circle cx="-6" cy="2" r="18" />
      <circle cx="30" cy="-4" r="16" /><circle cx="10" cy="-16" r="15" />
      <circle cx="-24" cy="-18" r="14" />
    </g>
    <path d="M44-22c14-8 26-6 34 2" fill="none" stroke="#4f7a3a" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
